[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "originsync-api"
version = "0.1.0"
description = "Cross-border trade compliance and escrow settlement API"
requires-python = ">=3.11"
dependencies = [
  "asyncpg>=0.29,<1",
  "email-validator>=2.1,<3",
  "fastapi>=0.110,<1",
  "google-auth>=2.29,<3",
  "google-genai>=1.0,<2",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.2,<3",
  "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.4,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/auth.py" = ["B008"]
"app/main.py" = ["B008"]
